<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Mermaid fixer bench</title>
<style>
body{font:13px/1.5 -apple-system,system-ui,sans-serif;margin:24px;color:#111}
table{border-collapse:collapse;width:100%;margin-top:12px}
td,th{border:1px solid #ddd;padding:4px 8px;vertical-align:top;text-align:left}
.ok{color:#0a7d32}.bad{color:#c62828}.warn{color:#b26a00}
pre{white-space:pre-wrap;margin:0;font:11px/1.45 ui-monospace,Menlo,monospace}
</style>
</head>
<body>
<h1>Mermaid fixer bench</h1>
<p id="summary">Running…</p>
<table><thead><tr><th>id</th><th>result</th><th>rules</th><th>error</th></tr></thead><tbody id="rows"></tbody></table>
<pre id="out"></pre>
<script src="./samples.js"></script>
<script src="/assets/mermaid-kit.js"></script>
<script>
(async function(){
  var K=window.MermaidKit,S=window.MMD_SAMPLES,rows=document.getElementById('rows');
  var res={version:K.version,broken:0,fixed:0,notBroken:[],failed:[],hardFixed:[],validBroken:[],validChanged:[],perRule:{},ms:0};
  var t0=Date.now();
  await K.ready();
  function row(id,cls,txt,rules,err){
    var tr=document.createElement('tr');
    tr.innerHTML='<td>'+id+'</td><td class="'+cls+'">'+txt+'</td><td>'+K.esc(rules||'')+'</td><td><pre>'+K.esc(err||'')+'</pre></td>';
    rows.appendChild(tr);
  }
  for(var i=0;i<S.broken.length;i++){
    var s=S.broken[i];
    var r0=await K.render(s.code,{});
    if(r0.ok){res.notBroken.push(s.id);row(s.id,'warn','renders already','');continue}
    res.broken++;
    var f=await K.fix(s.code,{source:'bench'});
    var final=f.ok?await K.render(f.code,{}):{ok:false};
    var rules=(f.applied||[]).map(function(r){return r.id}).join(', ');
    if(f.ok&&final.ok){
      res.fixed++;
      if(s.hard) res.hardFixed.push(s.id);
      (f.applied||[]).forEach(function(r){res.perRule[r.id]=(res.perRule[r.id]||0)+1});
      row(s.id,'ok','fixed',rules,'');
    }else{
      res.failed.push({id:s.id,hard:!!s.hard,error:(f.originalError||{}).title,code:f.code});
      row(s.id,'bad','not fixed'+(s.hard?' (expected)':''),rules,(f.originalError||{}).title+'\n\n'+f.code);
    }
  }
  for(var j=0;j<S.valid.length;j++){
    var v=S.valid[j];
    var rv=await K.render(v.code,{});
    if(!rv.ok){res.validBroken.push({id:v.id,error:rv.error.raw});row(v.id,'bad','valid sample fails to render','',rv.error.raw);continue}
    var fv=await K.fix(v.code,{source:'bench'});
    if(!fv.alreadyValid||fv.code!==v.code){res.validChanged.push(v.id);row(v.id,'bad','fixer changed valid code','',fv.code)}
    else row(v.id,'ok','untouched','','');
  }
  res.ms=Date.now()-t0;
  res.rate=res.broken?Math.round(res.fixed/res.broken*1000)/10:0;
  document.getElementById('summary').textContent='Fixed '+res.fixed+' / '+res.broken+' broken samples ('+res.rate+'%). '
    +res.notBroken.length+' samples already render. Valid regressions: '+(res.validBroken.length+res.validChanged.length)+'. '+res.ms+' ms.';
  document.getElementById('out').textContent='BENCH_RESULT '+JSON.stringify(res);
  document.title='DONE';
})().catch(function(e){document.getElementById('out').textContent='BENCH_ERROR '+(e&&e.stack||e);document.title='DONE'});
</script>
</body>
</html>
